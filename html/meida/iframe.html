<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iframe tag</title>
</head>
<body><!-- The <iframe> tag is an HTML element used to
     embed another HTML document or external content directly inside the current webpage -->
    <iframe src="https://www.wikipedia.org/" width="500" height="300" title="Wikipedia"></iframe>
    <iframe src="https://www.flipkart.com/" width="500" height="300" title="Flipkart" allowfullscreen></iframe>
    <iframe src="https://www.google.com/" width="500" height="300" title="google"></iframe> <!--/this is not open because google is not allow to open in iframe tag because x-frame of sameorigin-->
    <iframe src="/form.html" ></iframe> 
</body>
</html>
