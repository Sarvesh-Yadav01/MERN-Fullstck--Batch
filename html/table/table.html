<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table</title>
  </head>
  <body>
    <table border="1" cellpadding="20px" align="center" rules="all">
      <caption>
        PRODUCT TABLE
      </caption>
      <thead>
        <tr align="center">
          <th>S.No</th>
          <th>PRODUCT</th>
          <th>PRICE</th>
        </tr>
      </thead>

      <tbody>
        <tr align="center">
          <td>1</td>
          <td>kurkure</td>
          <td rowspan="2">50</td>
        </tr>

        <tr align="center">
          <td>2</td>
          <td>chocolate</td>
        </tr>
        <tr align="center">
          <td>3</td>
          <td>Diet Coke</td>
          <td>40</td>
        </tr>
        <tr align="center">
          <td>4</td>
          <td>lays</td>
          <td>20</td>
        </tr>
      </tbody>

      <tfoot>
        <tr align="center">
          <th colspan="2">Total Price</th>
          <th>110</th>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
